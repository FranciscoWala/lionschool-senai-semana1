<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LionSchool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="./scripts/main.js" defer type="module"></script>
    <script src="./scripts/aluno_tela.js" defer type="module"></script>
    <script type="module" src="./scripts/rotas/alunos.js" defer></script>
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="/style/style_alunos.css" />
    <link rel="stylesheet" href="/style/style_aluno_unico.css" />
  </head>

  <body>
    <header class="faixa_azul_header">
      <div class="itens_separados">
        <img
          src="/imagens-projeto/logo-lionschool.png"
          alt=" Imagem logo com texto LionSchool"
        />
        <img src="/imagens-projeto/sair.png" alt=" Ícone com texto de saída" />
      </div>
    </header>
    <main id="container_geral">
      <div class="informacao_aluno">
        <div class="card_aluno_unico">
          <img
            class="imagem_perfil"
            src="./imagens-projeto/imagem_aluno_unico.png"
            alt="Aluno do curso ${curso}"
          />
          <span>José Matheus da Silva Miranda</span>
        </div>

        <div class="grafico">
          <div class="barra">
            <span class="valor">90</span>
            <div class="fundo">
              <div class="preenchimento_cor"></div>
            </div>
            <span class="sigla">SOP</span>
          </div>
        </div>
      </div>
    </main>
    <footer class="faixa_azul_footer">
      <div class="coluna_esquerda_ftr">
        <div>
          <img src="./imagens-projeto/icon-telefone.png" alt="icone-telefone" />
          <span>(11) 4774-4700</span>
        </div>
        <div>
          <img src="./imagens-projeto/icon-email.png" alt="icone-email" />
          <span>lionschool@gmail.com</span>
        </div>
        <div>
          <img src="./imagens-projeto/icon-map.png" alt="icone-map" />
          <span>Rua tcc, 211, Centro, Jandira</span>
        </div>
      </div>

      <div class="coluna_central_ftr">
        <span>Copyright © 2026 | Fernando Leonid</span>
      </div>

      <div class="coluna_direita_ftr">
        <div class="social_images">
          <img src="./imagens-projeto/icone-youtube.png" alt="icone-youtube" />
          <img src="./imagens-projeto/icon-twitter.png" alt="icone-twitter" />
          <img
            src="./imagens-projeto/icon-instagram.png"
            alt="icone-instagram"
          />
          <img src="./imagens-projeto/icon-facebook.png" alt="icone-facebook" />
        </div>
      </div>
    </footer>
  </body>
</html>
